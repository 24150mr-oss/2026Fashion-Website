<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>title</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <!-- Plays the video automatically without sound. -->
<video autoplay muted id="myVideo">
  <source src="videos/video.mp4" type="video/mp4"> 
</video>

<!-- Puts the button over the video -->
<div class="content">

  <!-- Takes the user to the main website when clicked. -->
<button id="myBtn" onclick="window.location.href='index.html'">Go to Page</button>
</div>
</body>
</html>
